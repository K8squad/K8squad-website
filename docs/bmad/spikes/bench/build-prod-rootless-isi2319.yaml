# ISI-2319 — PRODUCTION-config rootless-dockerd build under gVisor (retest of ISI-2300 §3).
#
# Falsifiable hypothesis: moving rootlesskit from --net=host (reuse pod netns) to
# --net=slirp4netns (fresh OWNED netns) lets the per-container setns(CLONE_NEWNET)
# a `docker build` RUN step issues SUCCEED under this cluster's runsc, so a full
# multi-step build completes.
#
# Production changes vs the ISI-2295 bypass (see isi-2300 spike §3):
#   1. Image SHIPS slirp4netns. NOTE: docker:27-dind-rootless does NOT bundle
#      slirp4netns (only rootlesskit 2.3.2 + vpnkit) — verified ISI-2319. So a root
#      initContainer `apk add slirp4netns` (1.3.1) and stages the binary + its libs
#      (libglib-2.0, libslirp, libseccomp, libintl, libpcre2-8; musl/loader shared
#      with the daemon container since same base image) into /opt/slirp. This is the
#      spec's "or add apk add slirp4netns" path. The DAEMON container never runs as
#      root — only this setup initContainer does.
#   2. DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns (NOT host, NOT vpnkit).
#   3. Default bridge RESTORED — no --bridge=none. The rootless default bridge lives
#      inside rootlesskit's own netns; that is the per-container path under test.
#   4. docker build is NOT forced to --network=host — RUN steps create the per-container
#      sandbox (the netns that EPERM'd in ISI-2295).
#   5. Identical otherwise: daemon uid 1000, no privileged, runtimeClassName gvisor,
#      overlay2, dynatrace inject=false, Dockerfile.compile, n=1 (capability probe).
#
# --iptables/--ip6tables/--ip-forward are kept OFF: gVisor's netstack has no nft, and
# the offline build (GOPROXY=off) needs no NAT/egress. These flags skip NAT-rule
# programming ONLY — libnetwork still creates the per-container sandbox netns and issues
# the setns under test, so the hypothesis is preserved, not masked.
apiVersion: v1
kind: Namespace
metadata:
  name: rt-buildbench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodrootless
  namespace: rt-buildbench
data:
  Dockerfile.compile: |
    FROM golang:1.22-alpine AS build
    WORKDIR /src
    ENV CGO_ENABLED=0 GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-mod=mod
    RUN set -e; go mod init app >/dev/null 2>&1 || true; \
        { echo 'package main'; echo 'import ("fmt";"math")'; \
          i=0; while [ $i -lt 1500 ]; do \
            echo "func f$i(x float64) float64 { return math.Sqrt(x*float64($i)) + math.Sin(x) + math.Cos(x/float64($i+1)) }"; \
            i=$((i+1)); done; \
          echo 'func main(){ s:=0.0;'; \
          i=0; while [ $i -lt 1500 ]; do echo "s += f$i(float64($i))"; i=$((i+1)); done; \
          echo 'fmt.Println(s) }'; } > main.go; \
        wc -l main.go; \
        go build -o /out/app . ; \
        ls -l /out/app
    FROM alpine:3.19
    COPY --from=build /out/app /app
    RUN /app | head -c 40; echo " built"
  stage-slirp.sh: |
    #!/bin/sh
    # Runs as ROOT (initContainer) — install slirp4netns and stage it + libs to /opt/slirp.
    set -e
    apk add --no-cache slirp4netns
    mkdir -p /opt/slirp/bin /opt/slirp/lib
    cp /usr/bin/slirp4netns /opt/slirp/bin/
    for l in libglib-2.0.so.0 libslirp.so.0 libseccomp.so.2 libintl.so.8 libpcre2-8.so.0; do
      cp -a /usr/lib/$l* /opt/slirp/lib/ 2>/dev/null || true
    done
    chmod -R a+rx /opt/slirp
    echo "STAGED slirp4netns:"; /opt/slirp/bin/slirp4netns --version 2>&1 | head -1 || true
    ls -l /opt/slirp/bin /opt/slirp/lib
  run.sh: |
    #!/bin/sh
    set -u
    STORAGE="${STORAGE:-overlay2}"
    RKNET="${DOCKERD_ROOTLESS_ROOTLESSKIT_NET:-slirp4netns}"
    export PATH="/opt/slirp/bin:$PATH"
    export LD_LIBRARY_PATH="/opt/slirp/lib:${LD_LIBRARY_PATH:-}"
    export XDG_RUNTIME_DIR=/run/user/1000
    mkdir -p "$XDG_RUNTIME_DIR"
    export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"

    echo "PROD_ROOTLESS_START net=$RKNET storage=$STORAGE uid=$(id -u) gid=$(id -g)"
    if command -v slirp4netns >/dev/null 2>&1; then
      echo "SLIRP4NETNS_PRESENT $(slirp4netns --version 2>&1 | head -1)"
    else
      echo "SLIRP4NETNS_MISSING  <== staging failed; production path not testable"; exit 20
    fi

    # Production rootless daemon: fresh OWNED netns via slirp4netns + DEFAULT bridge.
    # No --bridge=none, no --network=host on build. iptables/ip-forward off (see header).
    rootlesskit \
      --net="$RKNET" --mtu=1500 \
      --copy-up=/etc --copy-up=/run \
      --disable-host-loopback \
      dockerd \
        --iptables=false --ip6tables=false --ip-forward=false \
        --storage-driver="$STORAGE" \
        --host="$DOCKER_HOST" >/tmp/dockerd.log 2>&1 &

    ok=0; i=0
    while [ $i -lt 100 ]; do
      if docker info >/dev/null 2>&1; then ok=1; break; fi
      sleep 2; i=$((i+1))
    done
    if [ $ok -ne 1 ]; then
      echo "DOCKERD_FAILED net=$RKNET storage=$STORAGE  <== dockerd did NOT start"
      echo "----- dockerd.log tail -----"; tail -n 80 /tmp/dockerd.log
      exit 10
    fi
    echo "DOCKERD_READY driver=$(docker info -f '{{.Driver}}' 2>/dev/null) net=$RKNET"
    docker network ls 2>&1 | sed 's/^/NETLS /'

    docker pull golang:1.22-alpine >/tmp/pullgo.log 2>&1 || { echo "PULL_FAILED golang"; tail -n 40 /tmp/pullgo.log; exit 11; }
    docker pull alpine:3.19        >/tmp/pull.log   2>&1 || { echo "PULL_FAILED alpine"; tail -n 40 /tmp/pull.log;   exit 11; }
    echo "BASE_READY"

    mkdir -p /tmp/ctx && cp /etc/prodrootless/Dockerfile.compile /tmp/ctx/Dockerfile
    cd /tmp/ctx

    # THE PROBE: no --network=host — RUN steps create the per-container sandbox netns.
    if docker build --no-cache -t bench:prod -f Dockerfile . >/tmp/build.log 2>&1; then
      echo "BUILD_OK net=$RKNET  <== RUN steps completed, image built (HYPOTHESIS: PASS)"
      docker images bench:prod 2>&1 | sed 's/^/IMG /'
    else
      echo "BUILD_FAILED net=$RKNET  <== RUN step did not complete (HYPOTHESIS: FAIL)"
      echo "----- build.log tail -----"; tail -n 60 /tmp/build.log
      echo "----- dockerd.log tail -----"; tail -n 40 /tmp/dockerd.log
      exit 12
    fi
    echo "PROD_ROOTLESS_DONE"
---
apiVersion: v1
kind: Pod
metadata:
  name: prod-rootless-gvisor
  namespace: rt-buildbench
  annotations: { dynatrace.com/inject: "false" }
  labels: { app: prodrootless, cell: prod-rootless-gvisor }
spec:
  nodeName: observable-agentsandbox-workers-4jjsr-stfbr
  runtimeClassName: gvisor
  restartPolicy: Never
  securityContext: {}
  initContainers:
    - name: stage-slirp
      image: docker:27-dind-rootless
      command: ["/bin/sh", "/etc/prodrootless/stage-slirp.sh"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - { name: cfg, mountPath: /etc/prodrootless }
        - { name: slirp, mountPath: /opt/slirp }
  containers:
    - name: dind
      image: docker:27-dind-rootless
      command: ["/bin/sh", "/etc/prodrootless/run.sh"]
      env:
        - { name: STORAGE, value: "overlay2" }
        - { name: DOCKERD_ROOTLESS_ROOTLESSKIT_NET, value: "slirp4netns" }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: Unconfined }
      resources:
        requests: { cpu: "1", memory: 1Gi }
        limits: { cpu: "3", memory: 3Gi }
      volumeMounts:
        - { name: cfg, mountPath: /etc/prodrootless }
        - { name: slirp, mountPath: /opt/slirp }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - { name: cfg, configMap: { name: prodrootless } }
    - { name: slirp, emptyDir: {} }
    - { name: tmp, emptyDir: { sizeLimit: 4Gi } }
