t-size="15" fill="#B6C3D8">A Squad is a Kubernetes resource that describes a team of agents and how they coordinate.</text><text x="310.0" y="220.0" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#E8EEF9">The Squad resource</text><text x="310.0" y="252.0" font-family="DejaVu Sans" font-size="14" fill="#B6C3D8">A Squad groups agents under a single project and namespace. The operator</text><text x="310.0" y="274.0" font-family="DejaVu Sans" font-size="14" fill="#B6C3D8">reconciles it into running pods, wires the coordination bus, and exposes</text><text x="310.0" y="296.0" font-family="DejaVu Sans" font-size="14" fill="#B6C3D8">every run to the console.</text><rect x="310.0" y="332.0" width="850.0" height="242.0" rx="10" fill="#0C0E15" stroke="#1E2230" stroke-width="1"/><rect x="310.0" y="332.0" width="850.0" height="30.0" rx="10" fill="#11141C"/><rect x="310.0" y="352.0" width="850.0" height="10.0" rx="0" fill="#11141C"/><text x="326.0" y="351.0" font-family="DejaVu Sans Mono" font-size="11" fill="#8B949E">squad.yaml</text><circle cx="1142.0" cy="347.0" r="3.0" fill="#8B949E" opacity="0.5"/><text x="326.0" y="390.0" font-family="DejaVu Sans Mono" font-size="13" fill="#FF7B72">apiVersion</text><text x="404.6" y="390.0" font-family="DejaVu Sans Mono" font-size="13" fill="#C9D4E5">: </text><text x="420.4" y="390.0" font-family="DejaVu Sans Mono" font-size="13" fill="#A5D6FF">ksquad.io/v1alpha1</text><text x="326.0" y="410.0" font-family="DejaVu Sans Mono" font-size="13" fill="#FF7B72">kind</text><text x="357.5" y="410.0" font-family="DejaVu Sans Mono" font-size="13" fill="#C9D4E5">: </text><text x="373.2" y="410.0" font-family="DejaVu Sans Mono" font-size="13" fill="#A5D6FF">Squad</text><text x="326.0" y="430.0" font-family="DejaVu Sans Mono" font-size="13" fill="#FF7B72">metadata</text><text x="388.9" y="430.0" font-family="DejaVu Sans Mono" font-size="13" fill="#C9D4E5">:</text><text x="341.7" y="450.0" font-family="DejaVu Sans Mono" font-size="13" f