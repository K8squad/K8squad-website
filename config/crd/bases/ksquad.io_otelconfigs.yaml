                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: |-
                          Endpoint is the OTLP receiver URL (e.g. "https://api.dynatrace.com/api/v2/otlp").
                          Must be a fully-qualified URL with scheme.
                        minLength: 1
                        type: string
                      protocol:
